<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 418" width="1040" height="418" role="img" aria-label="Sliding-window QRC: for each transaction, the card's last L transactions are fed one per layer into a fresh qubit register (reset input qubits, encode, evolve the whole register); the register is measured once at the end and a logistic regression turns the expectation values into a fraud score.">
